<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本土語音訊 · 閩南語</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f5;--panel:#fff;--ink:#14243b;--mute:#5b6b80;--line:#d5dde6;--accent:#1f7a68;--accent-ink:#fff;--active:#dff1ec}
@media (prefers-color-scheme:dark){:root{--bg:#0f1823;--panel:#18232f;--ink:#e8eef4;--mute:#93a3b5;--line:#2a3948;--accent:#4fc1a6;--accent-ink:#0b1a16;--active:#1b3a34}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.6;padding:0 0 150px}
main{max-width:720px;margin:0 auto;padding:40px 20px 0}
h1{font-size:2rem;margin:0 0 4px;letter-spacing:.04em}
.sub{color:var(--mute);margin:0 0 32px}
h2{font-size:1.15rem;margin:32px 0 10px;padding-left:12px;border-left:4px solid var(--accent)}
ul{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
li+li{border-top:1px solid var(--line)}
li button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;cursor:pointer;font-size:1.05rem}
li button:hover{background:var(--active)}
li button:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
li.on button{background:var(--active);font-weight:700}
.ico{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;color:var(--accent)}
li.on .ico{background:var(--accent);color:var(--accent-ink)}
.ico svg{width:14px;height:14px;fill:currentColor}
.dur{margin-left:auto;color:var(--mute);font-size:.9rem;font-variant-numeric:tabular-nums}
footer.player{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom))}
.pin{max-width:720px;margin:0 auto}
.now{font-weight:700;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
audio{width:100%;height:40px}
.ctl{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.ctl button,.ctl select{font:inherit;font-size:.9rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.ctl button:focus-visible,.ctl select:focus-visible{outline:3px solid var(--accent)}
.ctl label{margin-left:auto;color:var(--mute);font-size:.9rem}
.ctl button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1>本土語音訊</h1>
  <p class="sub">點選課文或詞語即可播放，可調整速度與重複播放。</p>
  <div id="list"></div>
</main>
<footer class="player"><div class="pin">
  <div class="now" id="now">尚未選擇音訊</div>
  <audio id="audio" controls preload="none"></audio>
  <div class="ctl">
    <button id="prev" type="button">上一個</button>
    <button id="next" type="button">下一個</button>
    <button id="loop" type="button" aria-pressed="false">單曲重複</button>
    <label>速度
      <select id="rate"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option></select>
    </label>
  </div>
</div></footer>
<script>
// 新增音訊：把檔案放進 audio/ 資料夾，然後在這裡加一行即可
const GROUPS = [
  { name: "G3 本土語", tracks: [
    { title: "節慶語詞",   src: "audio/g3-festival-words.mp3" },
    { title: "八月十五課文", src: "audio/g3-mid-autumn-text.mp3" }
  ]},
  { name: "G5 本土語", tracks: [
    { title: "115-1 閩南語 第1課課文（期中）", src: "audio/g5-lesson1-text.m4a" },
    { title: "115-1 閩南語 第1課詞語（期中）", src: "audio/g5-lesson1-words.m4a" }
  ]}
];
const flat = [], $ = id => document.getElementById(id);
const audio = $("audio"), now = $("now"), list = $("list");
let cur = -1;
const fmt = s => isFinite(s) ? Math.floor(s/60) + ":" + String(Math.floor(s%60)).padStart(2,"0") : "";

GROUPS.forEach(g => {
  const h = document.createElement("h2"); h.textContent = g.name;
  const ul = document.createElement("ul");
  g.tracks.forEach(t => {
    const i = flat.push(t) - 1;
    const li = document.createElement("li");
    li.innerHTML = '<button type="button"><span class="ico"><svg viewBox="0 0 14 14"><path d="M3 1l10 6-10 6z"/></svg></span><span></span><span class="dur"></span></button>';
    li.querySelector("button").children[1].textContent = t.title;
    li.querySelector("button").onclick = () => play(i);
    t.li = li; ul.appendChild(li);
    const probe = new Audio(); probe.preload = "metadata"; probe.src = t.src;
    probe.onloadedmetadata = () => li.querySelector(".dur").textContent = fmt(probe.duration);
  });
  list.append(h, ul);
});

function play(i){
  if (i < 0 || i >= flat.length) return;
  if (cur >= 0) flat[cur].li.classList.remove("on");
  cur = i; flat[i].li.classList.add("on");
  audio.src = flat[i].src;
  audio.playbackRate = +$("rate").value;
  now.textContent = flat[i].title;
  audio.play().catch(() => {});
}
$("prev").onclick = () => play(cur - 1);
$("next").onclick = () => play(cur + 1);
$("rate").onchange = e => audio.playbackRate = +e.target.value;
audio.onloadedmetadata = () => audio.playbackRate = +$("rate").value;
$("loop").onclick = e => {
  audio.loop = !audio.loop;
  e.target.classList.toggle("on", audio.loop);
  e.target.setAttribute("aria-pressed", audio.loop);
};
audio.onended = () => { if (!audio.loop && cur < flat.length - 1) play(cur + 1); };
</script>
</body>
</html>
